name: MLflow Project CI with Docker Hub

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow scikit-learn pandas numpy

      - name: 4. Run MLflow Project Training
        run: |
          cd MLProject
          python modelling.py --data_path telco_churn_preprocessing/customer_churn_clean.csv

      - name: 5. Save Artifacts to GitHub (Skilled)
        uses: actions/upload-artifact@v4
        with:
          name: mlruns-model-artifact
          path: MLProject/mlruns/

      - name: 6. Login to Docker Hub (Advance)
        if: env.DOCKER_USER != ''
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 7. Build Docker Image via MLflow and Push (Advance)
        if: env.DOCKER_USER != ''
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
        run: |
          # Cari model directory dari mlruns
          MODEL_URI=$(find MLProject/mlruns -type d -name "model" | head -n 1)
          IMAGE_NAME="${{ secrets.DOCKER_USERNAME }}/churn-model:latest"
          
          echo "Building Docker image from $MODEL_URI..."
          mlflow models build-docker -m "$MODEL_URI" -n "$IMAGE_NAME" --enable-mlserver
          
          echo "Pushing image to Docker Hub..."
          docker push "$IMAGE_NAME"
